[project]
name = "skiing-simulation"
version = "0.1.0"
description = "Symulacje ruchu narciarzy: modele Holleczka (2012), Zhanga (2024) oraz Kamińskiego (2026)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "mesa>=3.5.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
skiing-simulation = "skiing_simulation.holleczek.cli:main"
skiing-holleczek-simulation = "skiing_simulation.holleczek.cli:main"
skiing-zhang-simulation = "skiing_simulation.zhang.cli:main"
skiing-kaminski-simulation = "skiing_simulation.kaminski.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
